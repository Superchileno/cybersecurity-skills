name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Manifiesto actualizado
        run: python tools/build_manifest.py --repo . --check
      - name: Validar tarjetas y skills completas
        run: python scripts/validate_skills.py --repo . --verbose
      - name: CLI del arsenal
        run: python skills/CTF/bin/ctf-arsenal --list
